name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ── module hygiene ───────────────────────────────────────────────────
  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
      - run: go mod tidy
      # Whole-tree diff: this module has no external deps, so go.sum does
      # not exist — naming it explicitly errored with "no such path". A
      # bare diff still catches any go.mod (or future go.sum) drift.
      - run: git diff --exit-code

  # ── test matrix ──────────────────────────────────────────────────────
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23', '1.24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache: true
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
      - name: race
        run: go test ./... -race -count=1

  # ── integration ──────────────────────────────────────────────────────
  # Everything above tests the SQL drops *generates*, by comparing it to
  # what a test author expected. Three invalid-SQL bugs have shipped
  # past exactly that check. This job is the one where a server parses
  # the statement.
  integration:
    name: integration (real servers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: drops
          POSTGRES_PASSWORD: drops
          POSTGRES_DB: drops
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U drops -d drops"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: drops
          MYSQL_PASSWORD: drops
          MYSQL_DATABASE: drops
        ports: ['3307:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -udrops -pdrops"
          --health-interval 2s --health-timeout 3s --health-retries 40
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports: ['8124:8123', '9001:9000']
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports: ['6334:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true
      - name: test
        working-directory: integration
        env:
          DROPS_PG_DSN: postgres://drops:drops@localhost:5433/drops?sslmode=disable
          DROPS_MYSQL_DSN: drops:drops@tcp(localhost:3307)/drops?parseTime=true&multiStatements=true
          DROPS_CLICKHOUSE_DSN: clickhouse://localhost:9001/default
          DROPS_QDRANT_URL: http://localhost:6334
          # A DSN present but a server unreachable must fail rather than
          # skip: a silently skipped integration job is worse than none,
          # because it reports green.
          DROPS_REQUIRE_ALL: '1'
        run: go test ./... -count=1 -v

  # ── linters ───────────────────────────────────────────────────────────
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # ── security ─────────────────────────────────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The reported findings are all Go standard-library advisories
          # patched in the 1.25.x series; scan with the current toolchain
          # so a stale build target doesn't flag already-fixed stdlib CVEs.
          # (The test matrix still covers 1.22–1.24 for compatibility.)
          go-version: '1.25'
          check-latest: true
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
